<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#enable-audio {
	position: fixed;
	right: 20px;
	bottom: 20px;
	z-index: 200;
	padding: 14px 22px;
	border: 1px solid #c2d498;
	border-radius: 8px;
	background: #233c2b;
	color: #fff;
	font: 18px Arial, sans-serif;
	cursor: pointer;
}

#enable-audio[hidden] { display: none; }
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<button id="enable-audio" type="button" hidden>เปิดเสียง · Enable sound</button>
		<script>
// Keep Chrome's autoplay suspension visible and recover on real user input.
// Capture the engine's own context before it is constructed; use that same
// context for every retry, so no extra mixer or competing audio is created.
const gameAudioContexts = new Set();
const audioButton = document.getElementById('enable-audio');
let gameAudioReady = false;
const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
function updateAudioButton() {
	audioButton.hidden = !gameAudioReady || !Array.from(gameAudioContexts).some(
		(context) => context.state !== 'running' && context.state !== 'closed');
}
if (NativeAudioContext) {
	window.AudioContext = class extends NativeAudioContext {
		constructor(options) {
			super(options);
			gameAudioContexts.add(this);
			this.addEventListener('statechange', updateAudioButton);
			updateAudioButton();
		}
	};
}
function resumeGameAudio() {
	for (const context of gameAudioContexts) {
		if (context.state === 'running' || context.state === 'closed') continue;
		// Invoke resume synchronously inside the gesture, before any await.
		context.resume().then(updateAudioButton).catch(updateAudioButton);
	}
}
audioButton.addEventListener('click', () => {
	resumeGameAudio();
	document.getElementById('canvas').focus();
});
window.addEventListener('pointerdown', resumeGameAudio, {capture: true});
window.addEventListener('keydown', resumeGameAudio, {capture: true});
window.addEventListener('focus', resumeGameAudio);
document.addEventListener('visibilitychange', () => {
	if (document.visibilityState === 'visible') resumeGameAudio();
});
		</script>
		<script src="$GODOT_URL?build=tank-headshot-ammo-20261015"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
// Fetch a fresh pack after deployment while keeping its virtual filename clean.
const originalPack = GODOT_CONFIG.executable + '.pck';
const versionedPack = originalPack + '?build=' + GODOT_CONFIG.fileSizes[originalPack] + '-tank-headshot-ammo-20261015';
GODOT_CONFIG.fileSizes[versionedPack] = GODOT_CONFIG.fileSizes[originalPack];
const engine = new Engine(GODOT_CONFIG);
const preloadGameFile = engine.preloadFile.bind(engine);
engine.preloadFile = (file, path) => preloadGameFile(file === originalPack ? versionedPack : file, path);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			gameAudioReady = true;
			updateAudioButton();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
